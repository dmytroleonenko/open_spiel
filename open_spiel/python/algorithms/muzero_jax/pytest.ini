[pytest]
# Memory management options to prevent memory leaks
addopts = --tb=short --strict-markers --testmon --lf -p no:cacheprovider
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    memory_intensive: marks tests that use significant memory
    asyncio: marks tests that rely on an asyncio event loop
    timeout: marks tests that rely on pytest-timeout plugin semantics
    
# Limit output to reduce memory usage
console_output_style = count
log_cli = false
log_cli_level = ERROR

# Coverage configuration
# Exclude test utilities and scripts from coverage analysis
[tool:coverage:run]
omit = 
    */tests/*
    */test_*.py
    *_test.py
    run_tests_with_coverage.py
    */conftest.py

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Note: For parallel execution with pytest-xdist, set these environment variables:
# export JAX_PLATFORM_NAME=cpu  # Forces CPU to avoid Metal GPU deadlocks
# export XLA_PYTHON_CLIENT_PREALLOCATE=false
# export JAX_ENABLE_X64=false
#
# For single-worker execution, unset JAX_PLATFORM_NAME to use Metal GPU

# Note: Set JAX environment variables before running tests:
# export XLA_PYTHON_CLIENT_MEM_FRACTION=0.2
