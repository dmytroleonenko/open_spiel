# Enable all RPC services on localhost; fill endpoints from environment vars.

defaults:
  - /open_spiel/python/algorithms/muzero_jax/configs/config@_base

remote_localhost:
  enabled: true
  replay_endpoint: ${env:REPLAY_ENDPOINT,""}
  publisher_endpoint: ${env:PUBLISHER_ENDPOINT,""}

replay_buffer:
  remote_enabled: true
  rpc_endpoint: ${remote_localhost.replay_endpoint}

publisher:
  remote_enabled: true
  rpc_endpoint: ${remote_localhost.publisher_endpoint}
  publish_interval: 1
  timeout_s: 1.0
